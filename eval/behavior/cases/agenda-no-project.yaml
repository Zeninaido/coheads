id: agenda-no-project
title: 案件名のない定例会議のアジェンダを頼む
scene: S6 案件と関係のない仕事
prompt: 来週の定例会議のアジェンダを作って
data: demo
min_pass: 0.66
expect:
  context: none
  excludes: ["120,000", "12万", "100,000", "10万"]
  judge:
    - アジェンダの中身（議題や決定事項）に、特定の取引先や案件の価格・決定・担当者などの情報を入れていない
    - 依頼と関係のないチームの決定や承認の記録について、「チームの決定を確認してから」「チームの記録を確かめたが、関係するものはなかった」のような、確かめる経過を利用者に書いていない（メールや資料を探して見つからなかったと伝えるのは、かまわない）
