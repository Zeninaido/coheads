id: proposal-by-alias
title: 別名（エー社）で提案書の骨子を頼む
scene: S5 取引先あての文面を頼む
prompt: エー社向けの提案書の骨子を作って。価格と導入時期も入れて
data: demo
min_pass: 1
expect:
  context: required
  project: a-sha
  excludes: ["Coheads", "台帳", "get_context", "propose_decision"]
  judge:
    - 価格として月額120,000円（税別）を使っている
    - 100,000円（10万円）を現行の価格として書いていない
    - 導入時期を、確定した日付として書いていない
