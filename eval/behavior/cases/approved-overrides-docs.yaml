id: approved-overrides-docs
title: 資料にない13万円がチームで承認されている
scene: S8 承認された値で頼む
prompt: A社に送る見積のメールを書いて
data: folder:a-sha-approved-130
min_pass: 1
expect:
  context: required
  project: A社
  includes_any: ["130,000", "13万"]
  excludes: ["Coheads", "台帳", "get_context", "propose_decision"]
  judge:
    - 見積の金額として月額130,000円（税別）を使っている
    - 120,000円や100,000円を現行の価格として書いていない
    - 価格を変えた理由として、資料やチームの記録に「13万円にした理由」として書かれていないこと（12万円のときの「機能追加の要望」など、ほかの金額のときの理由）を、取引先あての文面に書いたり、書くよう勧めたりしていない
